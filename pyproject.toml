[project]
name = "gestao-arranjo"
version = "2.19.4"
description = "Gestão de Arranjo — coordenação de discursos públicos (Windows, Linux e Android)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flet>=0.85.3",
    # Sem pandas: ele e o numpy custavam ~27 MB no APK (mais que todo o resto
    # do Python empacotado) para serem usados só como "lista de linhas com
    # colunas nomeadas". Esse papel agora é do src/tabela.py, com a biblioteca
    # padrão. O python-dateutil saiu junto: só existia por causa do pandas.
    "reportlab",
    "Pillow",
    "openpyxl",
    "pypdf",
    # Só no desktop: leitura do Temas.xlsx (S-99) via engine calamine. No
    # Android o app usa temas_seed.json, então este pacote nativo é excluído
    # (o job Android do CI também remove esta linha por segurança).
    "python-calamine ; sys_platform != 'android'",
    # Windows: COM do Excel para o PDF de envio (opcional; degrada sem ele).
    "pywin32>=306 ; sys_platform == 'win32'",
    # Seletor NATIVO de contatos — extensão local em extensoes/flet_contatos.
    # O pacote Flutter por trás (flutter_contacts) só existe para Android/iOS,
    # então os jobs de Windows e Linux removem esta linha (e a de
    # tool.flet.dev_packages) antes de compilar. No PC o app importa isso de
    # forma protegida e usa o arquivo .vcf.
    "flet-contatos",
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.3",
    "flet-desktop>=0.85.3",
    "flet-web>=0.85.3",
    "pytest>=8",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# Ferramentas de qualidade (lint). Ruff substitui flake8/isort/black.
#   ruff check src tests        # lint
#   ruff format src tests       # formatação (opcional; não aplicada no legado)
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Conjunto focado em correção: erros de sintaxe/estilo (E/W), pyflakes (F,
# imports/nomes não usados) e ordenação de imports (I). O comprimento de linha
# (E501) não é bloqueante no código legado.
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.flet]
org = "br.com.iontech"
product = "Gestão de Arranjo"
company = "Gestão de Arranjo"
copyright = "Copyright (C) 2026"
# build_version é sobrescrito no CI por --build-version (vem da tag vX.Y.Z);
# build_number é o versionCode do Android (deve só crescer entre releases).
build_version = "2.19.4"
build_number = 62

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "br.com.iontech.gestaoarranjo"

# O banco fica na área privada do app. READ_CONTACTS é só para o botão
# "Buscar nos contatos": o seletor nativo devolve o contato escolhido, mas ler
# o TELEFONE dele exige a permissão. Nada é lido sem o usuário escolher, e o
# app funciona normalmente se ela for negada (cai no arquivo .vcf).
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.READ_CONTACTS" = true

# Extensão local com o seletor nativo (lado Python + lado Flutter). Só entra no
# build do Android; Windows e Linux removem esta seção no CI.
[tool.flet.dev_packages]
flet-contatos = "extensoes/flet_contatos"

[tool.uv.sources]
flet-contatos = { path = "extensoes/flet_contatos", editable = true }
