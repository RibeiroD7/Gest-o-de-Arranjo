name: Gerar instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Compilar
        # UTF-8 evita o UnicodeEncodeError do console cp1252 do Windows;
        # --no-rich-output desliga o indicador de progresso com caracteres especiais.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >
          flet build windows --yes --no-rich-output
          --project GestaoArranjo
          --product "Gestão de Arranjo"
          --company "Gestão de Arranjo"
          --org br.com.iontech
          --build-version ${{ env.VERSAO }}
          --verbose

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSAO }} installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GestaoArranjo-*-windows-instalador.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Compilar
        run: >
          flet build linux --yes
          --project GestaoArranjo
          --product "Gestão de Arranjo"
          --company "Gestão de Arranjo"
          --org br.com.iontech
          --build-version ${{ env.VERSAO }}
          --verbose

      - name: Compactar
        run: tar -czf GestaoArranjo-${{ env.VERSAO }}-linux.tar.gz -C build/linux .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: GestaoArranjo-*-linux.tar.gz

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: mobile
        # --split-per-abi gera um APK por arquitetura (bem menor que o
        # universal, que embute todas). Sem perda de funcionalidade.
        run: flet build apk --yes --split-per-abi --build-version ${{ env.VERSAO }} --verbose

      - name: Renomear APKs
        run: |
          echo "APKs gerados:"
          ls -la mobile/build/apk/
          # Principal: arm64-v8a (praticamente todos os celulares atuais).
          APK_ARM64=$(ls mobile/build/apk/*arm64-v8a*.apk 2>/dev/null | head -1)
          if [ -z "$APK_ARM64" ]; then APK_ARM64=$(ls mobile/build/apk/*.apk | head -1); fi
          cp "$APK_ARM64" GestaoArranjo-${{ env.VERSAO }}-android.apk
          # Reserva para aparelhos antigos de 32 bits, se existir.
          if ls mobile/build/apk/*armeabi-v7a*.apk >/dev/null 2>&1; then
            cp mobile/build/apk/*armeabi-v7a*.apk GestaoArranjo-${{ env.VERSAO }}-android-32bits.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: GestaoArranjo-*-android*.apk

  release:
    name: Publicar release
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Gestão de Arranjo ${{ github.ref_name }}
          files: artefatos/*
          body: |
            ## Downloads

            | Sistema | Arquivo |
            |---|---|
            | Windows | `GestaoArranjo-*-windows-instalador.exe` — execute e siga o instalador |
            | Linux | `GestaoArranjo-*-linux.tar.gz` — descompacte e execute `GestaoArranjo` |
            | Android | `GestaoArranjo-*-android.apk` — instale (celulares atuais). Aparelho antigo de 32 bits? Use `GestaoArranjo-*-android-32bits.apk` |

            O app inicia vazio: preencha **Ajustes → Minha congregação** e cadastre
            congregações, oradores e temas — ou importe tudo de uma planilha na tela
            de Programação.
