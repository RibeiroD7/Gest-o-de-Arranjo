name: Gerar instaladores

# Cada job compila e sobe o instalador DIRETO como asset da Release (não usa
# actions/upload-artifact). Assets de Release não contam na cota de
# armazenamento de artefatos do Actions — por isso a publicação não falha
# quando essa cota se esgota.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Injetar credenciais do Google (backup na nuvem)
        # Vêm dos secrets do repositório: ficam nos instaladores, nunca no
        # código publicado. Sem os secrets, o app pede as credenciais do
        # próprio usuário em Ajustes (nada quebra).
        shell: bash
        env:
          ID_DESKTOP: ${{ secrets.GOOGLE_CLIENT_ID_DESKTOP }}
          SECRET_DESKTOP: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP }}
          ID_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_ID_DISPOSITIVO }}
          SECRET_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_SECRET_DISPOSITIVO }}
        run: |
          python - <<'EOF'
          import os, pathlib
          arquivo = pathlib.Path("src/credenciais_app.py")
          texto = arquivo.read_text(encoding="utf-8")
          for chave, variavel in (
              ("CLIENT_ID_DESKTOP", "ID_DESKTOP"),
              ("CLIENT_SECRET_DESKTOP", "SECRET_DESKTOP"),
              ("CLIENT_ID_DISPOSITIVO", "ID_DISPOSITIVO"),
              ("CLIENT_SECRET_DISPOSITIVO", "SECRET_DISPOSITIVO"),
          ):
              texto = texto.replace(f'{chave} = ""', f'{chave} = "{os.environ.get(variavel, "")}"')
          arquivo.write_text(texto, encoding="utf-8")
          print("Credenciais embutidas:", [c for c in ("ID_DESKTOP","ID_DISPOSITIVO") if os.environ.get(c)])
          EOF

      - name: Compilar
        # UTF-8 evita o UnicodeEncodeError do console cp1252 do Windows;
        # --no-rich-output desliga o indicador de progresso com caracteres especiais.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: >
          flet build windows --yes --no-rich-output
          --project GestaoArranjo
          --product "Gestão de Arranjo"
          --company "Gestão de Arranjo"
          --org br.com.iontech
          --build-version ${{ env.VERSAO }}
          --verbose

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSAO }} installer.iss

      - name: Publicar instalador na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GestaoArranjo-*-windows-instalador.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Injetar credenciais do Google (backup na nuvem)
        # Vêm dos secrets do repositório: ficam nos instaladores, nunca no
        # código publicado. Sem os secrets, o app pede as credenciais do
        # próprio usuário em Ajustes (nada quebra).
        shell: bash
        env:
          ID_DESKTOP: ${{ secrets.GOOGLE_CLIENT_ID_DESKTOP }}
          SECRET_DESKTOP: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP }}
          ID_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_ID_DISPOSITIVO }}
          SECRET_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_SECRET_DISPOSITIVO }}
        run: |
          python - <<'EOF'
          import os, pathlib
          arquivo = pathlib.Path("src/credenciais_app.py")
          texto = arquivo.read_text(encoding="utf-8")
          for chave, variavel in (
              ("CLIENT_ID_DESKTOP", "ID_DESKTOP"),
              ("CLIENT_SECRET_DESKTOP", "SECRET_DESKTOP"),
              ("CLIENT_ID_DISPOSITIVO", "ID_DISPOSITIVO"),
              ("CLIENT_SECRET_DISPOSITIVO", "SECRET_DISPOSITIVO"),
          ):
              texto = texto.replace(f'{chave} = ""', f'{chave} = "{os.environ.get(variavel, "")}"')
          arquivo.write_text(texto, encoding="utf-8")
          print("Credenciais embutidas:", [c for c in ("ID_DESKTOP","ID_DISPOSITIVO") if os.environ.get(c)])
          EOF

      - name: Compilar
        run: >
          flet build linux --yes
          --project GestaoArranjo
          --product "Gestão de Arranjo"
          --company "Gestão de Arranjo"
          --org br.com.iontech
          --build-version ${{ env.VERSAO }}
          --verbose

      - name: Compactar
        run: tar -czf GestaoArranjo-${{ env.VERSAO }}-linux.tar.gz -C build/linux .

      - name: Publicar instalador na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GestaoArranjo-*-linux.tar.gz

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flet
        run: pip install "flet[all]>=0.85.3"

      - name: Definir versão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$VERSAO" == "$GITHUB_REF_NAME" ]] && VERSAO="1.0.0"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Remover dependências só de desktop
        # python-calamine é um pacote nativo (Rust) sem wheel para Android e é
        # usado apenas no desktop (leitura do Temas.xlsx). No celular a carga
        # inicial vem de temas_seed.json. Removemos a linha antes de compilar o
        # APK para não tentar instalá-la — a fonte .py continua única.
        run: sed -i '/python-calamine/d' pyproject.toml

      - name: Injetar credenciais do Google (backup na nuvem)
        # Vêm dos secrets do repositório: ficam nos instaladores, nunca no
        # código publicado. Sem os secrets, o app pede as credenciais do
        # próprio usuário em Ajustes (nada quebra).
        shell: bash
        env:
          ID_DESKTOP: ${{ secrets.GOOGLE_CLIENT_ID_DESKTOP }}
          SECRET_DESKTOP: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP }}
          ID_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_ID_DISPOSITIVO }}
          SECRET_DISPOSITIVO: ${{ secrets.GOOGLE_CLIENT_SECRET_DISPOSITIVO }}
        run: |
          python - <<'EOF'
          import os, pathlib
          arquivo = pathlib.Path("src/credenciais_app.py")
          texto = arquivo.read_text(encoding="utf-8")
          for chave, variavel in (
              ("CLIENT_ID_DESKTOP", "ID_DESKTOP"),
              ("CLIENT_SECRET_DESKTOP", "SECRET_DESKTOP"),
              ("CLIENT_ID_DISPOSITIVO", "ID_DISPOSITIVO"),
              ("CLIENT_SECRET_DISPOSITIVO", "SECRET_DISPOSITIVO"),
          ):
              texto = texto.replace(f'{chave} = ""', f'{chave} = "{os.environ.get(variavel, "")}"')
          arquivo.write_text(texto, encoding="utf-8")
          print("Credenciais embutidas:", [c for c in ("ID_DESKTOP","ID_DISPOSITIVO") if os.environ.get(c)])
          EOF

      - name: Compilar
        # --split-per-abi gera um APK por arquitetura (bem menor que o
        # universal, que embute todas). Sem perda de funcionalidade.
        run: flet build apk --yes --split-per-abi --build-version ${{ env.VERSAO }} --verbose

      - name: Renomear APKs
        run: |
          echo "APKs gerados:"
          ls -la build/apk/
          # Principal: arm64-v8a (praticamente todos os celulares atuais).
          APK_ARM64=$(ls build/apk/*arm64-v8a*.apk 2>/dev/null | head -1)
          if [ -z "$APK_ARM64" ]; then APK_ARM64=$(ls build/apk/*.apk | head -1); fi
          cp "$APK_ARM64" GestaoArranjo-${{ env.VERSAO }}-android.apk
          # Reserva para aparelhos antigos de 32 bits, se existir.
          if ls build/apk/*armeabi-v7a*.apk >/dev/null 2>&1; then
            cp build/apk/*armeabi-v7a*.apk GestaoArranjo-${{ env.VERSAO }}-android-32bits.apk
          fi

      # O Android é o último a terminar, então define aqui o nome e o corpo da
      # Release (os jobs de desktop só anexam seus arquivos). Se rodar antes dos
      # outros, cria a Release; se rodar depois, apenas atualiza — em qualquer
      # ordem o estado final é o mesmo.
      - name: Publicar instalador na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gestão de Arranjo ${{ github.ref_name }}
          files: GestaoArranjo-*-android*.apk
          body: |
            ## Downloads

            | Sistema | Arquivo |
            |---|---|
            | Windows | `GestaoArranjo-*-windows-instalador.exe` — execute e siga o instalador |
            | Linux | `GestaoArranjo-*-linux.tar.gz` — descompacte e execute `GestaoArranjo` |
            | Android | `GestaoArranjo-*-android.apk` — instale (celulares atuais). Aparelho antigo de 32 bits? Use `GestaoArranjo-*-android-32bits.apk` |

            O app inicia vazio: preencha **Ajustes → Minha congregação** e cadastre
            congregações, oradores e temas — ou importe tudo de uma planilha na tela
            de Programação.
